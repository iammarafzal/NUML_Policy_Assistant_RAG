<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <title>NUML Policy Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="chat-container">
        <!-- Header with University Logo -->
        <header class="chat-header">
            <div class="header-brand">
                <div class="logo-wrapper">
                    <img
                        class="university-logo-img"
                        src="{{ url_for('static', filename='images/numl_logo.png') }}"
                        alt="NUML Logo"
                        style="width: 100%; height: 100%; object-fit: contain; border-radius: var(--radius-md);"
                    >
                </div>
                <div class="brand-text">
                    <h1>NUML Policy Assistant</h1>
                    <span class="status-badge"><span class="status-dot"></span> Online</span>
                </div>
            </div>
            <button class="clear-btn" id="clearBtn" title="Clear Chat History" aria-label="Clear Chat History">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </header>

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant-message">
                <div class="message-content">
                    <p>Hello! I am your NUML Policy Assistant. How can I help you regarding university regulations and policies today?</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <footer class="chat-input-footer">
            <form class="input-form" id="chatForm">
                <input type="text" id="questionInput" placeholder="Ask a question about NUML policies..." required autocomplete="off">
                <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Custom Confirm Modal Overlay -->
    <div class="custom-modal-overlay" id="clearHistoryModal" style="display: none;">
        <div class="custom-modal">
            <div class="custom-modal-body" style="margin-top: 8px;">
                Are you sure you want to clear your conversation history?
            </div>
            <div class="custom-modal-footer">
                <button class="custom-btn custom-btn-primary" id="confirmClearBtn">OK</button>
                <button class="custom-btn custom-btn-secondary" id="cancelClearBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const clearHistoryModal = document.getElementById('clearHistoryModal');
        const confirmClearBtn = document.getElementById('confirmClearBtn');
        const cancelClearBtn = document.getElementById('cancelClearBtn');
        const chatForm = document.getElementById('chatForm');
        const questionInput = document.getElementById('questionInput');
        const clearBtn = document.getElementById('clearBtn');
        const sendBtn = document.getElementById('sendBtn');

        // Restore history on load
        document.addEventListener("DOMContentLoaded", () => {
            const savedHistory = localStorage.getItem('numl_chat_history');
            if (savedHistory) {
                chatMessages.innerHTML = savedHistory;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // Keep the viewport pinned correctly on mobile when the on-screen keyboard opens/closes
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.documentElement.style.setProperty('--app-height', `${window.visualViewport.height}px`);
            });
            document.documentElement.style.setProperty('--app-height', `${window.visualViewport.height}px`);
        }

        // Clear Chat History
        clearBtn.addEventListener('click', () => {
            clearHistoryModal.style.display = 'flex';
        });

        cancelClearBtn.addEventListener('click', () => {
            clearHistoryModal.style.display = 'none';
        });

        confirmClearBtn.addEventListener('click', () => {
            clearHistoryModal.style.display = 'none';
            localStorage.removeItem('numl_chat_history');
            chatMessages.innerHTML = `
                <div class="message assistant-message">
                    <div class="message-content">
                        <p>Hello! I am your NUML Policy Assistant. How can I help you regarding university regulations and policies today?</p>
                    </div>
                </div>`;
        });

        // Handle Asynchronous Request
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const question = questionInput.value.trim();
            if (!question) return;

            sendBtn.disabled = true;

            // 1. Append User Question
            const userMsgHTML = `
                <div class="message user-message">
                    <div class="message-content">
                        <p style="white-space: pre-wrap;">${escapeHTML(question)}</p>
                    </div>
                </div>`;

            // 2. Append Loading State
            const loadingHTML = `
                <div class="message assistant-message" id="loadingMsg">
                    <div class="message-content loading-content">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>`;

            chatMessages.innerHTML += userMsgHTML + loadingHTML;
            questionInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await res.json();

                const loadingMsg = document.getElementById('loadingMsg');
                if (loadingMsg) loadingMsg.remove();

                // 3. Format Sources
                let sourcesHTML = '';
                if (data.sources && data.sources.length > 0) {
                    const sourceItems = data.sources.map(src => {
                        const rawDoc = src.document || '';
                        const filename = rawDoc.split('/').pop().split('\\').pop() || 'Document';
                        return `<li>
                                    <span class="source-doc">${escapeHTML(filename)}</span>
                                    <span class="source-page">Pg. ${src.page ?? 'N/A'}</span>
                                </li>`;
                    }).join('');

                    sourcesHTML = `
                        <div class="sources-section">
                            <h4>Reference Sources</h4>
                            <ul>${sourceItems}</ul>
                        </div>`;
                }

                // 4. Append Assistant Response
                const assistantMsgHTML = `
                    <div class="message assistant-message">
                        <div class="message-content">
                            <p style="white-space: pre-wrap;">${escapeHTML(data.answer)}</p>
                            ${sourcesHTML}
                        </div>
                    </div>`;

                chatMessages.innerHTML += assistantMsgHTML;
                localStorage.setItem('numl_chat_history', chatMessages.innerHTML);

            } catch (err) {
                const loadingMsg = document.getElementById('loadingMsg');
                if (loadingMsg) loadingMsg.remove();

                chatMessages.innerHTML += `
                    <div class="message assistant-message">
                        <div class="message-content error-content">
                            <p>Unable to connect. Please check your connection and try again.</p>
                        </div>
                    </div>`;
            } finally {
                sendBtn.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                questionInput.focus();
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
